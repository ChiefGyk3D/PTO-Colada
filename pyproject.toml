[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pto-colada"
version = "1.1.0"
description = "Find long weekends and plan PTO around the holidays your employer actually observes."
readme = "README.md"
requires-python = ">=3.8"
keywords = ["holidays", "pto", "vacation", "calendar", "long weekend"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=5.1"]
xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=7.0", "PyYAML>=5.1", "openpyxl>=3.1"]

[project.scripts]
pto-colada = "longweekend.cli:main"
long-weekend = "longweekend.cli:main"   # alias kept so existing installs keep working

[project.urls]
Homepage = "https://github.com/ChiefGyk3D/PTO-Colada"
Repository = "https://github.com/ChiefGyk3D/PTO-Colada"
Issues = "https://github.com/ChiefGyk3D/PTO-Colada/issues"

[tool.setuptools]
packages = ["longweekend"]

# The conference catalog is data, not code, so it needs saying explicitly --
# otherwise it survives an editable install and vanishes from a wheel.
[tool.setuptools.package-data]
longweekend = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
