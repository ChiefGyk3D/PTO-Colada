# A generic employer's paid days for 2027, as explicit dates with a status.
# Requires PyYAML:  pip install "long-weekend-planner[yaml]"   (a JSON twin,
# employer-2027.json, needs nothing).
#
# status is one of:
#   confirmed             the employer has published this date
#   assumed               assumed to be a paid day; not confirmed
#   observed-unconfirmed  the holiday is paid but the observed date is a guess
#
# Nothing else is added automatically. Turn on extras by hand, for example
#   --add "Presidents Day=3rd MON in FEB"  or  --floating 2
# The 17 days below is only an example budget.
name: Employer 2027 (example)
workweek: MON-FRI
observance: none      # dates are already the observed dates; do not shift them
pto_days: 17

holidays:
  - {name: "New Year's Day",              date: 2027-01-01, status: confirmed}
  - {name: "Memorial Day",                date: 2027-05-31, status: assumed}
  - {name: "Independence Day (observed)", date: 2027-07-05, status: observed-unconfirmed}
  - {name: "Labor Day",                   date: 2027-09-06, status: assumed}
  - {name: "Thanksgiving",                date: 2027-11-25, status: confirmed}
  - {name: "Day After Thanksgiving",      date: 2027-11-26, status: confirmed}
  - {name: "Christmas (observed)",        date: 2027-12-24, status: observed-unconfirmed}
  - {name: "New Year's 2028 (observed)",  date: 2027-12-31, status: observed-unconfirmed}
