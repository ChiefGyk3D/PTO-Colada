# Lint, tests on Python 3.8-3.13, a CLI smoke test, and the shared security
# checks. The jobs live in ChiefGyk3D/git-your-ship-together; this file only
# says what is specific to PTO Colada. `CI green` at the end is the
# one check to require in branch protection.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC, so new advisories surface between commits
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@6f40107c2e05483f485452991e422f7f63886000 # v1.25.1
    permissions:
      contents: read
      id-token: write   # Doppler OIDC, declared by the shared workflow's coverage upload
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      # The oldest supported interpreters (3.8, 3.9) need ubuntu-24.04 or older;
      # the shared workflow's default runner list is exactly that.
      python-versions: '["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]'
      coverage-python-version: "3.13"
      lint-python-version: "3.13"
      install-command: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
      test-command: pytest -q
      # Correctness-only lint (syntax errors, undefined names, invalid
      # comparisons). Ruff's broader default set reports ~290 findings on code
      # that predates this lint; widening it is tracked as a follow-up.
      lint-command: ruff check --select E9,F63,F7,F82 .
      # Repo-specific: every CLI entry point must run end to end.
      smoke-install-command: pip install ".[yaml]"
      smoke-command: |
        python holiday.py --years 1
        pto-colada --help > /dev/null
        long-weekend --help > /dev/null
        python -m pto_colada.cli --pto 15 --format json > /dev/null
        python -m pto_colada.cli --pto 15 --format ics > /dev/null
        python -m pto_colada.cli --list-known > /dev/null
        python -m pto_colada.cli --list-observances > /dev/null
        python -m pto_colada.cli --list-conferences > /dev/null
        python -m pto_colada.cli --pto 15 --observe jewish --years 1 > /dev/null
        python -m pto_colada.cli --pto 15 --conference "DEF CON" --years 1 > /dev/null
        python -m pto_colada.cli --config examples/employer-2027.yaml --goal balanced --start-year 2027 --years 1 > /dev/null
        python -m pto_colada.cli --today 2026-11-02 --pto-hours 36 --refill-hours 120 --through 2027-03-31 --max-work-streak 40 > /dev/null
      docker-build: false   # no Dockerfile in this repository

  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@6f40107c2e05483f485452991e422f7f63886000 # v1.25.1
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only

  ci-green:
    name: CI green
    if: always()
    needs: [ci, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ]; then
              echo "::error::a required job ended as '$r'"
              exit 1
            fi
          done
