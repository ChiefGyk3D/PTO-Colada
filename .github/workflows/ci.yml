name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # Pinned rather than ubuntu-latest: the setup-python manifest only ships
    # 3.8/3.9 builds up to 24.04, so the oldest supported interpreters stop
    # being installable the day ubuntu-latest moves on.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Check the CLI runs
        run: |
          python holiday.py --years 1
          python -m longweekend.cli --pto 15 --format json > /dev/null
          python -m longweekend.cli --pto 15 --format ics > /dev/null
          python -m longweekend.cli --list-known > /dev/null
          python -m longweekend.cli --list-observances > /dev/null
          python -m longweekend.cli --list-conferences > /dev/null
          python -m longweekend.cli --pto 15 --observe jewish --years 1 > /dev/null
          python -m longweekend.cli --pto 15 --conference "DEF CON" --years 1 > /dev/null
